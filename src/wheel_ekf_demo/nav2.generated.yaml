planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins:
    - GridBased
    expected_planner_frequency: 2.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: false
      allow_unknown: false
      tolerance: 0.1
controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    odom_topic: /hardware_demo/odometry/filtered
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.035
      approach_velocity_scaling_dist: 0.35
      rotate_to_heading_angular_vel: 0.65
      rotate_to_heading_min_angle: 0.65
      use_rotate_to_heading: true
      allow_reversing: false
      max_angular_accel: 10.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.45
      regulated_linear_scaling_min_speed: 0.04
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.18
      inflation_cost_scaling_factor: 3.0
      transform_tolerance: 0.2
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.1
          obstacle_max_range: 3.0
          raytrace_min_range: 0.1
          raytrace_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.29000000000000004
      always_send_full_costmap: true
      robot_radius: 0.14
      footprint_padding: 0.01
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.1
          obstacle_max_range: 3.0
          raytrace_min_range: 0.1
          raytrace_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.29000000000000004
      always_send_full_costmap: true
      robot_radius: 0.14
      footprint_padding: 0.01
behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    local_costmap_topic: /local_costmap/costmap_raw
    global_costmap_topic: /global_costmap/costmap_raw
    local_footprint_topic: /local_costmap/published_footprint
    global_footprint_topic: /global_costmap/published_footprint
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    cycle_frequency: 10.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.2
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /hardware_demo/odometry/filtered
    transform_tolerance: 0.3
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: true
    max_velocity:
    - 0.15
    - 0.0
    - 0.8
    min_velocity:
    - -0.08
    - 0.0
    - -0.8
    max_accel:
    - 0.4
    - 0.0
    - 1.2
    max_decel:
    - -0.6
    - 0.0
    - -1.6
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.2
    odom_topic: /hardware_demo/odometry/filtered
collision_monitor:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    enabled: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /hardware_demo/nav_cmd_vel
    state_topic: /collision_monitor_state
    source_timeout: 0.5
    transform_tolerance: 0.2
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons:
    - StopZone
    StopZone:
      type: circle
      action_type: stop
      min_points: 3
      enabled: true
      visualize: false
      radius: 0.21000000000000002
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan
      enabled: true
