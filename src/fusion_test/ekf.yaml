ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # nav_msgs/msg/Odometry: wheel encoder-derived measurements.
    odom0: odometry/wheel
    odom0_queue_size: 10
    # Order: x, y, z, roll, pitch, yaw,
    #        vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az.
    # Use forward speed, the differential-drive zero-sideways-speed
    # constraint, and turning rate. Do not also fuse encoder-derived pose.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # sensor_msgs/msg/Imu: gyro z in rad/s. No absolute yaw or acceleration.
    imu0: imu/data_raw
    imu0_queue_size: 20
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
