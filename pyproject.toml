[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-anomaly"
version = "0.1.0"
description = "Offline occupancy-map change detection for SWARM"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "Pillow>=11,<13", "PyYAML>=6,<7"]

[project.scripts]
swarm-anomaly = "swarm_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["swarm_anomaly*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["docker/sim/swarm-rviz-config"]
# Hardware tools and upstream drivers remain outside the lint scope.
extend-exclude = [
    "src/fusion_test",
    "src/motor_test",
    "src/rplidar_test",
    "src/sllidar_ros2",
    "src/wheel_ekf_demo",
    "build",
    "install",
    "log",
    "maps",
    "bags",
    "artifacts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# Dynamic external formats, such as RViz's plugin YAML, can require Any.
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
